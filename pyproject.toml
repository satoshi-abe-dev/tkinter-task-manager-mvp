# pytest の設定だけを置く最小構成。パッケージング（build-system 等）は行わない。
[tool.pytest.ini_options]
# bare `pytest` が .venv/ や temp/ を走査しないよう、収集対象を絞る。
# 収集されるのは task_manager_tkinter/test_presenter.py と test_gui_smoke.py。
testpaths = ["task_manager_tkinter"]
markers = [
    "smoke: 実物の Tkinter GUI を一度だけ組み立てる。tkinter/画面が無ければ skip",
]
