# CI: 2 種類の自動テストを複数 OS で回す。
#   presenter-tests … ロジック(Model / Presenter / 抽象 View)の pytest ユニットテスト。tkinter 不要。
#   gui-smoke       … 実物の Tkinter ウィジェットが例外なく組み上がるかの確認。
name: CI

on:
  push:
    branches: [main] # main に入った後に流す
  pull_request:
    branches: [main] # main 向け PR を、マージ前にブランチの状態で流す

jobs:
  # task_manager_tkinter/test_presenter.py（pytest）を Linux / Windows / macOS で実行する。
  # tkinter を一切 import しないので、pytest 以外の追加インストールは要らない。
  presenter-tests:
    strategy:
      fail-fast: false # 1 OS が落ちても他をキャンセルせず、全 OS の結果を見る
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5 # リポジトリをランナーへチェックアウトする

      - uses: actions/setup-python@v6 # 指定バージョンの Python を入れて PATH を通す
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      # python3 ではなく python（Windows には python3 が無い。python は全 OS で有効）
      - name: Run pytest
        run: python -m pytest

  # smoke_gui.py を、画面(Tcl/Tk)が使える OS でだけ実行する。
  # ubuntu-latest は setup-python の Python に tkinter が無く自己スキップで終わるため外す。
  gui-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # スモークテストは TkMainWindow を生成するだけだが、tkcalendar を import するため必要
      - name: Install GUI dependencies
        run: python -m pip install -r requirements.txt

      # TkMainWindow() を生成 → destroy するだけ（mainloop は呼ばない）。
      # 画面が無ければスクリプト側で自動スキップして正常終了する。
      - name: Run GUI construction smoke test
        run: python -m task_manager_tkinter.smoke_gui
