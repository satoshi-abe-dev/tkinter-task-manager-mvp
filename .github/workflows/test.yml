name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  presenter-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run presenter tests
        run: python -m task_manager_tkinter.test_presenter

  gui-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GUI dependencies
        run: python -m pip install -r requirements.txt

      - name: Run GUI construction smoke test
        run: python -m task_manager_tkinter.test_gui_smoke
